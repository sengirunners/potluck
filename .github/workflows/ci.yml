name: ci
on:
  push:
    branches: [main]
  pull_request:
# Read-only token. A pull request from a fork runs on GitHub-hosted ubuntu-latest, never a self-hosted runner
# (internal/workflowlint holds this); the guard is false on push, so main and same-repository PRs take route's label.
permissions:
  contents: read
# A newer push to a pull request cancels that pull request's older run; a push to main never cancels (each commit's
# run decides whether release.yml publishes it).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Where go runs: the self-hosted scale set CI_ROUTE_LABEL (a repository variable) when the capacity report at
  # CI_CAPACITY_URL (a repository secret, so public logs do not print it) says it has a free runner, else the
  # hosted fallback (scripts/ci/runner-route.sh). With either unset the fallback is picked without a request.
  # route runs on GitHub-hosted ubuntu-slim (a few billed seconds a run), so a scale set that is busy or down never
  # holds the choice up. CI_ROUTING=off sends all to the fallback.
  route:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    outputs:
      label: ${{ steps.pick.outputs.label }}
      # potluck-pool's runs-on: the pool label in the repository variable POTLUCK_POOL_CI (for example pool:c1m2).
      pool: ${{ vars.POTLUCK_POOL_CI }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - id: pick
        env:
          ROUTING: ${{ vars.CI_ROUTING }}
          ROUTE_LABEL: ${{ vars.CI_ROUTE_LABEL }}
          CAPACITY_URL: ${{ secrets.CI_CAPACITY_URL }}
          ROUTE_FALLBACK: sengi-standard-4-ubuntu-2404
        run: scripts/ci/runner-route.sh
  go:
    needs: route
    # A failed or skipped route still runs go, on the fallback.
    if: ${{ !cancelled() }}
    # Four cores: the kit, compute and vmhost packages test beside conformance.
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || needs.route.outputs.label || 'sengi-standard-4-ubuntu-2404' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # vmhost/shelfhelper runs its helper with node and npm (Node 22, the agent image's), and fails under CI
      # without them.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt needed"; exit 1; }
      - name: go mod tidy leaves no diff
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: go test -json wrapper regression
        run: scripts/ci/go-test-json_test.sh
      # A throwaway HOME and ZM_HOME, as zm's own suite runs: no test can touch real dotfiles and pass silently.
      # The whole suite runs on every PR and on main; internal/layers checks the layer rule and that nothing
      # here depends on zm.
      #
      # Two go test runs at once. The conformance package alone took 15 of this job's 16 minutes at go test's
      # default -parallel (the core count, 4): its drivers mostly wait on shell scripts and deadlines, so it runs at
      # -parallel 16 in one go test while every other package runs in a second, the slowest of them listed first so
      # none starts last and runs alone (a package missing from that list only starts later; go test refuses a name
      # that is no package). The step fails if either fails.
      - name: go test
        # umask 022: the runner's shell has 077, under which boxcp's TestDirRoundTrip fails (the reference box's
        # tar extracts through the umask). It fails the same way in zm under 077 and passes in zm's CI.
        run: |
          set -o pipefail
          umask 022
          tmp=$(mktemp -d)
          for v in $(env | grep -E '^ZM_' | cut -d= -f1); do unset "$v"; done
          export GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" GOPATH="$(go env GOPATH)" \
            HOME="$tmp/home" ZM_HOME="$tmp/zm"
          mod=github.com/sengirunners/potluck
          slow="$mod/vmhost $mod/runners $mod/scripts/release $mod/runtarget $mod/kit/owners"
          rest=$(go list ./... | grep -vxF "$mod/conformance")
          for p in $slow; do rest=$(printf '%s\n' "$rest" | grep -vxF "$p"); done
          [ "$(printf '%s\n' "$rest" | wc -l)" -gt 10 ] || { echo "go list named too few packages"; exit 1; }
          # conformance's lines come as they are written, each starting "conformance: ", so a timeout or a cancel
          # still shows them.
          # Under pipefail the pipeline's status is go test's, and waiting on it waits for sed's last line too.
          # Each run also writes go test -json (every test's pass, fail or skip) for the improvement loop's merge step,
          # uploaded below as go-test-json; the log stays go test's own (scripts/ci/go-test-json.sh).
          scripts/ci/go-test-json.sh "$GITHUB_WORKSPACE/go-test-conformance.json" -timeout 30m -parallel 16 ./conformance/ 2>&1 | sed -u 's/^/conformance: /' &
          conf=$!
          code=0
          scripts/ci/go-test-json.sh "$GITHUB_WORKSPACE/go-test.json" -timeout 30m $slow $rest || code=$?
          wait "$conf" || code=$?
          exit "$code"
      - if: ${{ always() }}
        continue-on-error: true # a report for a person and the loop to read; a full storage quota must not red the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-json
          path: |
            go-test.json
            go-test-conformance.json
          if-no-files-found: ignore
          retention-days: 30
  # Conformance as a report: potluck-conformance against potluck-driver-local (scripts/ci/conformance-report.sh), its
  # results written as JSON with the skipped checks' names (--json-out) and uploaded as the conformance-results
  # artifact. Report only: no required check names it, no job needs it, and the conformance step does not fail the
  # job (the run summary shows its outcome and the report's text; results.json holds passed, failed and the skipped
  # names). go above already runs the suite as a test and is what gates. It takes a GitHub-hosted runner, not
  # route's label, so it never holds the one free self-hosted runner go needs.
  conformance-report:
    runs-on: ubuntu-latest
    # release.yml publishes only when this workflow run succeeded, so a failure of any step here (checkout, setup,
    # upload, the job timeout) must not turn the run red either.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: conformance run
        id: run
        continue-on-error: true
        # A hang ends this step, not the job, so the job stays green.
        timeout-minutes: 10
        run: scripts/ci/conformance-report.sh conformance-results/results.json
      - name: summary
        if: ${{ always() }}
        run: |
          {
            echo "### potluck-conformance (report only)"
            echo "conformance step: ${{ steps.run.outcome }}"
            echo '```'
            if [ -f conformance-results/results.txt ]; then
              grep -E 'check\(s\) (skipped|failed)|^  - |^FAIL  |^--strict|--json-out:' conformance-results/results.txt || echo "no checks skipped or failed"
            else
              echo "no results.txt (the step did not get as far as running)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: conformance-results
          path: conformance-results/
          if-no-files-found: warn
          retention-days: 30
  # A few fast, hermetic checks on a Potluck pool runner (a box on a machine lent to the pool), so Potluck's own CI
  # uses Potluck. A shadow: no required check names it and no job needs it, so a pool that is down, busy or broken
  # by the change under test never blocks a merge; go above still runs the whole suite off the pool. It runs only
  # when the repository variable POTLUCK_POOL_CI names the pool label (unset: skipped), for pushes to main and pull
  # requests from this repository's own branches; a fork's pull request is skipped, and the runs-on guard sends it
  # to ubuntu-latest anyway.
  potluck-pool:
    needs: route
    if: ${{ needs.route.result == 'success' && needs.route.outputs.pool != '' && !(github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || needs.route.outputs.pool || 'ubuntu-latest' }}
    timeout-minutes: 15
    # One run per branch: a newer push cancels the older one still queued for, or running on, the small box.
    concurrency:
      group: potluck-pool-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: where this ran
        run: echo "runner $RUNNER_NAME ($RUNNER_OS $RUNNER_ARCH) on $(uname -sr), $(nproc) cpu"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: site tests
        working-directory: site
        run: npm test
      - name: go test (a few small packages)
        run: |
          umask 022
          tmp=$(mktemp -d)
          env GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" GOPATH="$(go env GOPATH)" \
            HOME="$tmp/home" go test -timeout 5m ./placement/ ./jobrule/ ./internal/forkguard/ ./internal/workflowlint/
