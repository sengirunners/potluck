# Potluck's release channel: after each push to main whose ci passes (and on demand), build the newest green main
# into release tarballs for macOS and Linux, sign a manifest of their SHA-256 sums with the channel's Ed25519 key
# (raw, and as SSHSIG for ssh-keygen), and publish a GitHub release tagged potluck-<version>. install.sh and
# `potluck upgrade` install only what verifies with a public key built into potluck
# (internal/upgrade/release_keys.txt; install.sh carries the same list).
# The private key lives only in the potluck-release environment (secret POTLUCK_RELEASE_KEY), which deploys from
# main alone.
#
# Three jobs: pick (the newest green main), menubar (builds Potluck Menu.app on a GitHub-hosted Mac: swiftc is
# not Go) and release (builds the tarballs, with the app's zip inside each darwin one, signs and publishes). The
# app is ad hoc signed, not Developer ID signed or notarized, until the owners provide an Apple Developer ID
# (docs/menubar.md). A failed app build never blocks a release: the tarballs ship without the zip, with a warning.
#
# Why this polls ci instead of running after it: a workflow_run trigger, or a release job inside ci.yml (needs: on
# its jobs, or a workflow_call), puts a write-scoped job in a workflow a fork's pull request can start, which
# internal/workflowlint refuses. So this runs on push, waits at most 20 minutes for that commit's ci (it takes about
# 12), and otherwise releases the newest main whose ci passed. Key rotation: docs/release-keys.md.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: potluck-release
  cancel-in-progress: false
jobs:
  pick:
    name: pick the last green main
    runs-on: ${{ vars.RELEASE_RUNNER || 'sengi-standard-4-ubuntu-2404' }}
    if: github.ref == 'refs/heads/main' && github.repository == 'sengirunners/potluck'
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    outputs:
      go: ${{ steps.decide.outputs.go }}
      sha: ${{ steps.pick.outputs.sha }}
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # On a push, wait (at most 20 minutes) for this commit's ci run; then take the newest main push whose ci
      # passed, so a red commit never releases and a run that queued behind another never releases an older one.
      - name: pick the last green main
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          runs="repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=50"
          if [[ "$EVENT" == push ]]; then
            for _ in $(seq 1 20); do
              state=$(gh api "$runs&head_sha=$SHA" --jq '[.workflow_runs[] | select(.repository.full_name==env.GH_REPO)] | max_by(.run_number) | (.status // "none") + " " + (.conclusion // "")')
              case "$state" in
                "completed success") break ;;
                completed*) echo "::notice::ci for $SHA ended ${state#completed }: not releasing it"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              esac
              sleep 60
            done
          fi
          sha=$(gh api "$runs&status=success" \
            --jq '[.workflow_runs[] | select(.head_branch=="main" and .event=="push" and .conclusion=="success" and .repository.full_name==env.GH_REPO)] | max_by(.run_number) | .head_sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "no green main push"; exit 1; }
          tag="potluck-main-${sha:0:12}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=main-${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$tag is published already"
          elif gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            # A tag without its release was deleted by hand: never publish it again. Yank with --prerelease.
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$tag was deleted; not republishing it"
          fi
      - name: release this commit?
        id: decide
        run: |
          if [[ "${{ steps.pick.outputs.skip }}" != true ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  # Potluck Menu.app, built on a GitHub-hosted Mac (never a self-hosted runner, whose owner a release must not
  # depend on) from the picked commit: arm64 and x86_64 joined, ad hoc signed, zipped with ditto.
  menubar:
    name: build Potluck Menu.app
    needs: pick
    if: needs.pick.outputs.go == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: build and zip
        shell: bash
        run: |
          set -euo pipefail
          # An older picked commit may predate the universal build: fail (the release then ships without the app).
          grep -q POTLUCK_MENU_UNIVERSAL macos/PotluckMenu/build.sh
          app="$RUNNER_TEMP/app/Potluck Menu.app"
          POTLUCK_MENU_UNIVERSAL=1 macos/PotluckMenu/build.sh "$RUNNER_TEMP/app"
          archs=$(lipo -archs "$app/Contents/MacOS/PotluckMenu")
          echo "archs: $archs"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          codesign --verify --deep --strict "$app"
          mkdir -p menubar
          ditto -c -k --keepParent "$app" menubar/Potluck-Menu.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: potluck-menu
          path: menubar/Potluck-Menu.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: build, sign, publish
    needs: [pick, menubar]
    if: ${{ !cancelled() && needs.pick.outputs.go == 'true' }}
    runs-on: ${{ vars.RELEASE_RUNNER || 'sengi-standard-4-ubuntu-2404' }}
    environment: potluck-release
    permissions:
      contents: write
      actions: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The picked commit's trusted key list must parse, in potluck and in install.sh alike.
      - name: release keys are set
        run: go test -count=1 -run '^(TestReleaseKeys|TestInstallScriptCarriesTheReleaseKeys)$' ./internal/upgrade/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: app
        if: needs.menubar.result == 'success'
        continue-on-error: true # a failed download ships the release without the app, like a failed build
        with:
          name: potluck-menu
          path: ${{ runner.temp }}/menubar
      - name: build
        shell: bash
        run: |
          set -euo pipefail
          app=()
          if [[ "${{ needs.menubar.result }}" == success && "${{ steps.app.outcome }}" == success && -f "$RUNNER_TEMP/menubar/Potluck-Menu.zip" ]]; then
            app=(-menubar "$RUNNER_TEMP/menubar/Potluck-Menu.zip")
          else
            echo "::warning::no Potluck Menu.app this release (the menubar job ${{ needs.menubar.result }}): the darwin tarballs ship without it"
          fi
          go run ./scripts/release -version "${{ needs.pick.outputs.version }}" -commit "${{ needs.pick.outputs.sha }}" -out dist "${app[@]}"
      - name: sign
        env:
          POTLUCK_RELEASE_KEY: ${{ secrets.POTLUCK_RELEASE_KEY }}
        run: go run ./scripts/release-sign -version "${{ needs.pick.outputs.version }}" -commit "${{ needs.pick.outputs.sha }}" -out dist
      # The release's own potluck must verify it with its built-in keys alone (an empty home: no update_keys), so a
      # secret that matches no key in release_keys.txt never publishes.
      - name: verify with the built-in keys
        shell: bash
        run: |
          set -euo pipefail
          t=$(mktemp -d)
          tar -xzf "dist/potluck_${{ needs.pick.outputs.version }}_linux_$(go env GOARCH).tar.gz" -C "$t"
          HOME="$t/home" POTLUCK_HOME="$t/potluck" POTLUCK_NO_AUTOSTART=1 \
            "$t/potluck_${{ needs.pick.outputs.version }}_linux_$(go env GOARCH)/potluck" upgrade --release dist --dir "$t/bin"
          "$t/bin/potluck" --version
      # install.sh checks the release as a stranger's machine would, in an empty home with only the system's tools:
      # the SSHSIG signature with ssh-keygen against the keys it carries, then the tarball's SHA-256. A release it
      # would refuse is never published.
      - name: install with install.sh
        shell: bash
        run: |
          set -euo pipefail
          t=$(mktemp -d)
          env -i HOME="$t/home" POTLUCK_HOME="$t/potluck" POTLUCK_INSTALL_DIR="$t/bin" POTLUCK_NO_AUTOSTART=1 \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin sh install.sh --from dist 2>&1 | tee "$t/log"
          grep -q 'signature verified with a release key (SSHSIG, checked with ssh-keygen)' "$t/log"
          "$t/bin/potluck" --version
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          notes="Signed potluck release of green main ${{ needs.pick.outputs.sha }}. Install: install.sh (README). Upgrade: potluck upgrade. Yank it (nothing installs it): gh release edit ${{ needs.pick.outputs.tag }} --prerelease"
          if [[ "${{ needs.menubar.result }}" == success && "${{ steps.app.outcome }}" == success && -f "$RUNNER_TEMP/menubar/Potluck-Menu.zip" ]]; then
            notes="$notes. The darwin tarballs also carry Potluck Menu.app (the menu bar item), NOT Developer ID signed or notarized: install it with install.sh --menubar (docs/menubar.md)."
          fi
          gh release create "${{ needs.pick.outputs.tag }}" dist/*.tar.gz dist/SHA256SUMS dist/manifest.json dist/manifest.json.sig dist/manifest.json.sshsig \
            --target "${{ needs.pick.outputs.sha }}" --title "potluck ${{ needs.pick.outputs.version }}" --latest --notes "$notes"
      # Keep the newest 30 releases and any younger than 14 days; a failure here never fails the release.
      - name: prune old releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name | test("^potluck-main-[0-9a-f]{12}$")) | [(.published_at // .created_at), .tag_name] | @tsv' |
            sort -r | tail -n +31 | while IFS=$'\t' read -r at tag; do
              if [[ "$at" < "$cutoff" ]]; then
                gh release delete "$tag" --yes --cleanup-tag && echo "pruned $tag (published $at)"
              fi
            done
