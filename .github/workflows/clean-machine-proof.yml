# The README quick start on a fresh GitHub-hosted VM with no zm (scripts/clean-machine-proof.sh): install from the
# newest signed release, a pool, this VM shared with it from a second home over a Cloudflare quick tunnel, a sandbox
# and a job on it. Run by hand; it reads only this repository (the release) and pulls the public box images.
name: clean-machine-proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/clean-machine-proof.sh
          sparse-checkout-cone-mode: false
      - name: keep the script, drop the checkout (the machine holds no Potluck source)
        run: |
          cp scripts/clean-machine-proof.sh "$RUNNER_TEMP/proof.sh"
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - name: proof
        env:
          GH_TOKEN: ${{ github.token }}
          WORK: ${{ runner.temp }}/p
        shell: bash
        run: |
          mkdir -p "$WORK" && cd "$WORK"
          set -o pipefail
          sh "$RUNNER_TEMP/proof.sh" 2>&1 | tee "$RUNNER_TEMP/proof.log"
      - name: daemon and tunnel logs
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/p/owner/daemon.log "$RUNNER_TEMP"/p/lender/daemon.log "$RUNNER_TEMP"/p/cloudflared.log; do
            if [ -f "$f" ]; then echo "== $f"; tail -n 80 "$f"; fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proof-log
          path: ${{ runner.temp }}/proof.log
